upstream fridah_backend {
    server backend:8000;
}

# Plain HTTP: only serves ACME challenges (for issuing/renewing the SSL cert) and
# redirects everything else to HTTPS. Never proxies API traffic over plain HTTP.
server {
    listen 80;
    server_name api.fridah.co.ke;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.fridah.co.ke;

    client_max_body_size 20M;

    ssl_certificate     /etc/letsencrypt/live/api.fridah.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.fridah.co.ke/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Only PUBLIC images are served straight from disk (listing, property and unit photos, logos, profile photos).
    # Everything else under /media/ is private (National ID scans, agreements, statements, receipts, property
    # documents, maintenance photos) and is reachable only through the API's short-lived signed links.
    location ~ ^/media/(agency_logos|profile_photos|property_images|unit_images|listing_images)/ {
        root /app;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public";
    }

    location /media/ {
        return 404;
    }

    # Doesn't need Django/Postgres up to answer, so it's still useful if the app
    # container is mid-restart - nginx itself responds instantly.
    location = /nginx-healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://fridah_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
