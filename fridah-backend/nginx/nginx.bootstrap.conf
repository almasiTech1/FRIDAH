# Used ONLY by scripts/init-ssl.sh for the very first certificate issuance, before any
# SSL cert exists on the server. nginx.conf (the real config) references cert files at
# /etc/letsencrypt/live/api.fridah.co.ke/ that don't exist yet on a brand-new server, and
# nginx refuses to even start if a referenced ssl_certificate file is missing - so this
# bootstrap config (HTTP only, no SSL directives) is swapped in first to serve the ACME
# HTTP-01 challenge, then swapped back out for nginx.conf once the cert exists.
server {
    listen 80;
    server_name api.fridah.co.ke;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "Fridah API - provisioning SSL certificate, check back shortly.\n";
        add_header Content-Type text/plain;
    }
}
