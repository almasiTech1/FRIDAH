name: Backend CI

on:
  push:
    paths:
      - 'fridah-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'fridah-backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: fridah-backend

env:
  USE_SQLITE: 'True'
  SECRET_KEY: 'ci-test-secret-key-not-for-production'
  DEBUG: 'False'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: fridah-backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check

      - name: Run test suite
        run: pytest apps/ tests/ -q --cov=apps --cov=common --cov-report=xml --cov-report=term

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: fridah-backend/coverage.xml

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
        continue-on-error: true  # report findings without blocking the build; review manually
